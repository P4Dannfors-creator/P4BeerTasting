<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Skapa Öl-databas</title>
    <style>
        body { font-family: sans-serif; padding: 40px; background: #12100e; color: #fefae0; text-align: center; }
        .btn { background: #d4a373; color: #000; padding: 15px 30px; font-size: 1.2rem; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin: 20px 0; }
        .btn:hover { background: #faedcd; }
        #status { font-size: 1.1rem; color: #b0a89f; margin-top: 20px; white-space: pre-line; }
    </style>
</head>
<body>
    <h1>🍺 Systembolaget API -> sortiment.json</h1>
    <p>Detta verktyg laddar ner hela Systembolagets databas, rensar bort allt vin och sprit, <br>och skapar en optimerad fil för din PubProvning-app.</p>
    
    <button class="btn" onclick="buildDatabase()">Hämta och bygg filen</button>
    <div id="status">Väntar på att starta...</div>

    <script>
        async function buildDatabase() {
            const status = document.getElementById('status');
            status.textContent = "1. Laddar ner rådata från GitHub (ca 30 MB)... Vänligen vänta ⏳";
            
            try {
                const response = await fetch('https://raw.githubusercontent.com/AlexGustafsson/systembolaget-api-data/main/data/assortment.json');
                if (!response.ok) throw new Error("Kunde inte hämta filen. Kontrollera din internetuppkoppling.");
                
                status.textContent = "2. Filen hämtad! Laddar in i minnet... ⚙️";
                const allProducts = await response.json();
                
                status.textContent = "3. Rensar bort allt utom öl och städar datan... 🧹";
                const beers = allProducts
                    .filter(p => p.categoryLevel1 === "Öl")
                    .map(p => {
                        let rawStyle = (p.categoryLevel2 || "").toLowerCase();
                        let mappedStyle = "Övrigt";
                        
                        if (rawStyle.includes("lager")) mappedStyle = "Lager";
                        else if (rawStyle.includes("ipa") || rawStyle.includes("india pale ale")) mappedStyle = "IPA";
                        else if (rawStyle.includes("stout") || rawStyle.includes("porter")) mappedStyle = "Stout";
                        else if (rawStyle.includes("syrlig") || rawStyle.includes("sour")) mappedStyle = "Sour";
                        else if (rawStyle.includes("vete")) mappedStyle = "Veteöl";
                        else if (rawStyle.includes("ale")) mappedStyle = "Ale";
                        else mappedStyle = p.categoryLevel2 || "Övrigt";

                        return {
                            id: p.productId,
                            artNr: p.productNumberShort || p.productNumber,
                            name: (p.productNameBold + " " + (p.productNameThin || "")).trim(),
                            style: mappedStyle,
                            abv: p.alcoholPercentage || 0,
                            price: p.price || 0,
                            country: p.country || "Okänt",
                            snack: (p.tasteSymbols && p.tasteSymbols.length > 0) ? p.tasteSymbols.join(", ") : "Passande snacks"
                        };
                    });

                status.textContent = `4. Klar! Hittade ${beers.length} ölsorter. Skapar filen... 💾`;

                const blob = new Blob([JSON.stringify(beers, null, 2)], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = url;
                a.download = "sortiment.json";
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                status.textContent = `✅ Succé! \n\nFilen 'sortiment.json' laddades ner till din dator. \nDen innehåller alla ${beers.length} öl från Systembolaget.\n\nDu kan nu ladda upp den på GitHub!`;

            } catch (error) {
                status.textContent = "❌ Något gick fel: " + error.message;
            }
        }
    </script>
</body>
</html>
